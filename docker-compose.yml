services:

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      CLUSTER_ID: "1L6g7nGhU-eAKfL--X25wo"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Default partition count for auto-created topics. Without this the
      # `orders` topic is auto-created with 1 partition on a fresh volume,
      # which silently starves extra group members (only one consumer per
      # group gets the single partition). 6 matches the documented design.
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    volumes:
      - kafka_kraft:/var/lib/kafka/data


  postgres:
    image: postgres:17
    container_name: kafka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orders}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
      API_ADDR: ${API_ADDR:-:8080}


  order-worker:
    build: .
    command: ["./order-worker"]
    restart: on-failure

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
      KAFKA_START_OFFSET: ${KAFKA_START_OFFSET:-first}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/orders}


  analytics:
    build: .
    command: ["./analytics"]
    restart: on-failure

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
      KAFKA_START_OFFSET: ${KAFKA_START_OFFSET:-first}


  notifications:
    build: .
    command: ["./notifications"]
    restart: on-failure

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
      KAFKA_START_OFFSET: ${KAFKA_START_OFFSET:-first}


volumes:
  kafka_kraft:
  postgres_data:
